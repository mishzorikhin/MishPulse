services:
  db:
    # Минимальный PostgreSQL на Alpine без лишних расширений (~десятки МБ вместо сотен у postgres:latest)
    image: ghcr.io/oorabona/postgres:17-alpine
    environment:
      POSTGRES_USER: mishpulse
      POSTGRES_PASSWORD: mishpulse
      POSTGRES_DB: mishpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mishpulse -d mishpulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      MISHPULSE_DATABASE_URL: postgresql+psycopg2://mishpulse:mishpulse@db:5432/mishpulse
      MISHPULSE_DEAD_AFTER_SECONDS: "300"
      MISHPULSE_WATCHDOG_INTERVAL_SECONDS: "30"
      # MISHPULSE_NTFY_SERVER: "https://ntfy.sh"
      # MISHPULSE_TELEGRAM_BOT_TOKEN: "123456:ABC-DEF"
      MISHPULSE_ADMIN_PASSWORD: "changeme"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
